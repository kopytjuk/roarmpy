[build-system]
requires = ["uv_build>=0.9.9,<0.10.0"]
build-backend = "uv_build"

[project]
name = "roarmpy"
version = "0.0.4"
description = "Python library to interface RoArm robot arms"
readme = "README.md"
requires-python = ">=3.9"

license = "MIT"
license-files = ["LICEN[CS]E*"]

authors = [ {name = "Marat Kopytjuk", email="kopytjuk@gmail.com"} ]
dependencies = [
    # Core library support, require Python 3.9+
    "modern-robotics>=1.1.1; python_version >= \"3.9\"",
    # Numpy is required on all supported platforms; keep a liberal marker
    "numpy>=2.0.0; python_version >= \"3.9\"",
    # pyserial and requests are pure-python and supported everywhere
    "pyserial>=3.0; python_version >= \"3.9\"",
    "requests>=2.32.0",
    "requests>=2.32.0; python_version >= \"3.9\"",
    "scipy>=1.12.0",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

[project.urls]
Homepage = "https://github.com/kopytjuk/roarmpy"
Issues = "https://github.com/kopytjuk/roarmpy/issues"


[project.optional-dependencies]
dev = [
    "uv>=0.6.0",
    "pytest>=8.3.5",
    "build>=0.10",
]

# Optional extra for Raspberry Pi / ARM platforms.
# Use with `pip install .[raspberry-pi]` when on Raspberry Pi to hint
# platform-specific installs; platform_machine markers cover common ARM names.
raspberry-pi = [
    # Numpy on ARM/PI: providing a hint via markers; installers on Pi
    # may prefer wheels built for aarch64/armv7l or manual installation.
    "numpy>=1.24.4; platform_machine == \"armv7l\" or platform_machine == \"aarch64\" or platform_machine == \"arm64\"",
]

[dependency-groups]
dev = [
    "ipykernel>=6.31.0",
    "matplotlib>=3.9.4",
    "pre-commit>=4.3.0",
    "pytest>=8.3.5",
    "pytransform3d>=3.14.3",
    "ruff>=0.14.5",
]

[tool.ruff]
line-length = 88
target-version = "py311"
exclude = [
    "*.ipynb",
]

[tool.ruff.lint]
select = ["E", "F", "B", "I"]  # example rules
ignore = ["E501", "F401"]              # ignore line-length if you want

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[[tool.uv.index]]
name = "testpypi"
url = "https://test.pypi.org/legacy/"
publish-url = "https://test.pypi.org/legacy/"
explicit = true
